# Dependabot for the umbrella: only what lives in this repository — GitHub Actions and
# the images pinned in deploy/local/compose.yml. Component dependencies are updated in their repositories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /deploy/local
    schedule:
      interval: weekly
    commit-message:
      prefix: compose
    # Chainguard images (cgr.dev/chainguard/*) are pinned by digest and updated by hand:
    # Dependabot cannot query cgr.dev (private_source_authentication_failure). It names
    # them without the registry host, hence both patterns.
    ignore:
      - dependency-name: "chainguard/*"
      - dependency-name: "cgr.dev/chainguard/*"
