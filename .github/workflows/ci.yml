# Umbrella CI. Component tests run here, not only in their own repositories: the
# components take their neighbours (sdk/platform-auth-sdk, sdk/platform-llm, the core and its
# client in services/control-plane, sdk/skill-sdk) as path dependencies and do not build in a
# standalone checkout. A checkout with submodules gives everyone neighbours at pinned revisions
# in the layout services/, sdk/, apps/ (TAI-ADR-0064).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.0"

jobs:
  python:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: platform-auth-sdk
            directory: sdk/platform-auth-sdk
          - component: platform-llm
            directory: sdk/platform-llm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: uv sync --all-groups 2>/dev/null || uv sync --dev
      - name: ruff
        working-directory: ${{ matrix.directory }}
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        working-directory: ${{ matrix.directory }}
        run: uv run pytest -q tests

  # Components with their own make targets: CI calls them instead of copying the commands —
  # `make check` of a component is everything it considers mandatory.
  component:
    name: ${{ matrix.component }} (make check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: skill-sdk
            directory: sdk/skill-sdk
          - component: package-sdk
            directory: sdk/package-sdk
          - component: iam-service
            directory: services/iam-service
          - component: memory-service
            directory: services/memory-service
          - component: fleet
            directory: services/fleet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make install
        working-directory: ${{ matrix.directory }}
        run: make install
      - name: make check
        working-directory: ${{ matrix.directory }}
        run: make check
      - name: Umbrella packages against the package schema
        # The suite of package-sdk runs on its own fixture snapshot of the packages; the umbrella
        # ships only packages/example, which is checked against the format's schema here.
        if: matrix.component == 'package-sdk'
        working-directory: sdk/package-sdk
        env:
          PACKAGE_SDK_UMBRELLA: ${{ github.workspace }}
        run: uv run --all-extras pytest -q tests/test_umbrella_packages.py

  control-plane:
    name: control-plane (all tests, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
          POSTGRES_DB: control_plane_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U control_plane -d control_plane_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make lint + make test (unit, client, integration, concurrency)
        working-directory: services/control-plane
        env:
          CP_TEST_DATABASE_URL: postgresql+psycopg://control_plane:control_plane@localhost:5434/control_plane_test
        run: |
          make install
          make lint
          make test PYTEST_ARGS="-q tests/unit tests/client tests/integration tests/concurrency"
      - name: skill-sdk through the core skill executor
        run: make -C sdk/skill-sdk test-e2e
      - name: Catalog packages with the core's validators (package-sdk)
        # The package SDK from its submodule in the core's environment: the core's code at the revision tested above
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/package-sdk/src
        run: uv run --project services/control-plane python -m package_sdk.cli check --install deploy/packages.yaml

  notification-service:
    name: notification-service (all tests, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
          POSTGRES_DB: notification_test
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U notification -d notification_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make install, lint, migrations-check, test
        working-directory: services/notification-service
        env:
          NS_TEST_DATABASE_URL: postgresql+psycopg://notification:notification@localhost:5436/notification_test
        run: |
          make install
          make lint
          make migrations-check
          make test

  umbrella:
    name: umbrella (tools, compose, links, oss-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # oss-check inspects the history reachable from the revision (gitleaks)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff + tests of tools/
        run: |
          uvx ruff check tools deploy
          uvx ruff format --check tools deploy
          # the bootstrap tests use fake IAM and Control Plane servers and the package SDK of sdk/package-sdk
          uv run --no-project --with pytest --with pyyaml --with jsonschema --with ruamel.yaml python -m pytest -q tools/tests
      - name: Compose interpolation, every profile alone and all together (clean .env, make secrets)
        run: |
          cp .env.example .env
          python3 tools/fill_secrets.py .env
          mkdir -p secrets && touch secrets/iam-signing.pem
          make config-all
      - name: The default profiles (core edge) without the IdP, the console, assistants and fleet
        run: |
          tools/compose --profile core --profile edge config --services > /tmp/core-services
          cat /tmp/core-services
          if grep -xE 'keycloak.*|realm-render|console|harness-.*|fleet-.*' /tmp/core-services; then
            echo "a service outside the core got into the default profiles"; exit 1
          fi
      - name: Compose of a fleet node
        run: |
          cp deploy/node/.env.example deploy/node/.env
          docker compose -f deploy/node/compose.yml config --quiet
      - name: Catalog packages (schema and references, without the core's code)
        # The package SDK is the sdk/package-sdk submodule; the core's validators run in the control-plane job
        run: |
          PYTHONPATH=sdk/package-sdk/src uv run --no-project --with pyyaml --with jsonschema --with ruamel.yaml \
            python -m package_sdk.cli check --schema-only --install deploy/packages.yaml
      - name: Documentation links
        run: python3 tools/linkcheck.py
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: oss-check umbrella
        # The private stop-list is the OSS_CHECK_STOPLIST secret (one regular expression per line);
        # without it, licences, document language and gitleaks are checked.
        env:
          OSS_CHECK_STOPLIST: ${{ secrets.OSS_CHECK_STOPLIST }}
        run: python3 tools/oss_check.py . --ref HEAD

  guide:
    name: guide guide/ (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make guide
        run: |
          if [ ! -f guide/mkdocs.yml ]; then echo "no guide/ yet — skipping"; exit 0; fi
          make guide

  quickstart:
    name: quickstart from a clean clone (core edge)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Platform tag criterion: the README steps
    # make secrets → make up → make bootstrap → make smoke pass on a clean machine.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # make bootstrap runs through uv: the package SDK needs PyYAML and jsonschema
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: make secrets
        run: |
          make secrets
          sudo chown 10001:10001 secrets/*.pem secrets/runtime-console-*-secret
          sudo chmod 600 secrets/*.pem secrets/runtime-console-*-secret
      - name: make up PROFILES="core edge"
        run: |
          start=$(date +%s)
          make up PROFILES="core edge"
          echo "build+up: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for healthz
        run: |
          for i in $(seq 1 60); do make smoke >/dev/null 2>&1 && break; sleep 5; done
          make smoke
      - name: make bootstrap (twice — idempotency)
        run: |
          make bootstrap
          sudo test -f secrets/harness-pat || { echo "bootstrap did not issue a PAT"; exit 1; }
          make bootstrap
      - name: Restart the core after bootstrap, then smoke
        run: |
          tools/compose --profile core --profile edge up -d control-plane-api control-plane-worker context-adapter
          for i in $(seq 1 60); do make smoke >/dev/null 2>&1 && break; sleep 5; done
          make smoke
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: tools/compose --profile "*" logs --tail 200
