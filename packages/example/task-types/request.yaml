# yaml-language-server: $schema=../../../sdk/package-sdk/schema/v1/object.schema.json
apiVersion: taimen.ai/v1
kind: TaskType
key: request
spec:
  displayName: Request
  description: An incoming request that someone takes on and closes with an answer.
  fieldSchema:
    type: object
    properties:
      requester:
        type: string
        maxLength: 200
        description: Who made the request
      dueDate:
        type: string
        format: date
        description: Desired response date
  lifecycleSchema:
    statuses:
      - {key: new, category: backlog, displayName: New}
      - {key: in_progress, category: active, displayName: In progress}
      - {key: waiting, category: blocked, displayName: Waiting for reply}
      - {key: answered, category: terminal_success, displayName: Answered}
      - {key: rejected, category: terminal_cancelled, displayName: Rejected}
    transitions:
      - {from: new, to: [in_progress, rejected]}
      - {from: in_progress, to: [new, waiting, answered, rejected]}
      - {from: waiting, to: [in_progress, answered, rejected]}
    initialStatus: new
    claimStatus: in_progress
    releaseStatus: new
    completionStatus: answered
  approvalSchema: {}
