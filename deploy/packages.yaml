# yaml-language-server: $schema=../sdk/package-sdk/schema/v1/object.schema.json
# Catalog install file: which packages from packages/ to install into the installation.
# make bootstrap applies it at step 5b; afterwards, with the package SDK (sdk/package-sdk):
#   make packages-check                                  # package-sdk check --install deploy/packages.yaml
#   make packages-plan  SERVER=http://taimen.localhost   # package-sdk plan --install … --out <plan>
#   make packages-apply SERVER=http://taimen.localhost   # package-sdk apply --plan <plan>
apiVersion: taimen.ai/v1
kind: Installation
key: default
spec:
  packages: [example]
